<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeCode</title>    <link rel="stylesheet" href=".//assets/css/style.css">
    <link rel="stylesheet" href=".//assets/css/sign-up.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
    
</head>
<body>
    
    <nav>
        <div class="container">
            <div class="logo member">                
                <a href="./index.html">
                    WeCode
                    <div class="overlay"></div>
                </a>
            </div>
            <div class="searching-bar member">
                <i class="fa-solid fa-magnifying-glass" id="search-icon"></i>
                <input type="text" placeholder="Search something . . ." id="searching-input">
            </div>
            <div class="announcement member">                
                <a href="">
                    <i class="fa-solid fa-bell"></i>
                    <div class="overlay"></div>
                </a>
            </div>
            <div class="sign-up member">
                <a href="./sign-up.html">
                    Sign up
                    <div class="overlay"></div>                
                </a>
            </div>
            <div class="sign-in member">
                <a href="./sign-in.html">
                    Sign in
                    <div class="overlay"></div>                    
                </a>
            </div>
        </div>
    </nav>

    <div class="main">
        <div class="container">
            <div class="sign-up-header">
                <h3>Hello</h3>
                <p>Sign up your account</p>
            </div>
            <div class="sign-up-form">
                <div class="form-group">
                    <label for="#user-name-input">User name:</label>
                    <input id="user-name-input" placeholder="Type your user name"></input>
                </div>                
                <div class="form-group">
                    <label for="#email-input">Email:</label>
                    <input id="email-input" placeholder="Type your registered email"></input>
                </div>
                <div class="form-group">
                    <label for="#password-input">Password:</label>
                    <input id="password-input" placeholder="Type your password" type="password"></input>
                </div>
                <div class="form-group">
                    <label for="#repeat-password-input">Repeat password:</label>
                    <input id="repeat-password-input" placeholder="Type your password again" type="password"></input>
                </div>                
                <button type="submit" id="sign-up-button">Sign up</button>
                <h5>- or -</h5>
                <div class="sign-up-with">
                    <button id="sign-up-with-google-button" type="submit">
                        Sign up with <span><i class="fab fa-google"></i></span> google
                    </button>
                    <button id="sign-up-with-facebook-button" type="submit">
                        Sign up with <span><i class="fab fa-facebook"></i></span> facebook
                    </button>                    
                </div>
                <div class="sign-up-assist">
                    <p>Already have an account? <a href="./sign-in.html">Sign in</a></p>
                </div>
            </div>              
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-logo">
                <div class="title">
                    <a href="index.html">WeCode</a>
                </div>
                <div class="content">
                    <p>Sharing content, knowledge and information about coding community</p>
                </div>
            </div>
            <div class="footer-contact">
                <div class="title">
                    <h1>Contact</h1>
                </div>
                <div class="content">
                    <div class="contact-info">
                        <div class="icon">
                            <i class="fa-solid fa-phone-flip"></i>
                        </div>
                        <div class="info">
                            0977133586
                        </div>
                    </div>
                    <div class="contact-info">
                        <div class="icon">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="info">
                            admin@wecode.com
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-social-media">
                <div class="title">
                    <h1>Social media</h1>
                </div>
                <div class="content">
                    Follow our social medias to get the lastest news
                </div>
                <div class="content icon">
                    <a href="">
                        <i class="fab fa-facebook"></i>
                    </a>
                    <a href="">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="">
                        <i class="fab fa-youtube"></i>
                    </a>
                </div>                                
            </div>
        </div>
    </footer>

    <script src=".//assets/js/sign-up.js"></script>

</body>
</html>
