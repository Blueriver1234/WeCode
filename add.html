<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeCode</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/add.css">
    <link rel="stylesheet" href="./assets/css/fontawesome-free-6.7.2-web/fontawesome-free-6.7.2-web/css/all.min.css">
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">

</head>

<body>

    <nav>
        <div class="container">
            <div class="logo member">
                <a href="./index.html">
                    WeCode
                </a>
            </div>
            <div class="searching-bar member">
                <i class="fa-solid fa-magnifying-glass" id="search-icon"></i>
                <input type="text" placeholder="Search something . . ." id="searching-input">
            </div>
            <div class="announcement member">
                <a href="">
                    <i class="fa-solid fa-bell"></i>
                </a>
            </div>
            <div class="sign-up member" id="sign-up">
                <a href="./sign-up.html" class="sign-links">
                    Sign up
                </a>
            </div>
            <div class="sign-in member">
                <a href="./sign-in.html" class="sign-links">
                    Sign in
                </a>
            </div>
            <a href="./user/user-profile.html" id="userInfo"></a>
            <div id="logoutContainer" style="display:inline-block;"></div>
        </div>
    </nav>

    <form id="postForm">
        <h2>Add a Post:</h2>
        <br>
        <label for="postTitle">Title:</label>
        <input type="text" id="postTitle" required>
        <br>
        <label for="postDescription">Description:</label>
        <textarea id="postDescription" required></textarea>
        <br>
        <label for="postImage">Upload Image:</label>
        <input type="file" id="postImage" accept="image/*">
        <br>
        <button type="submit">Add Post</button>
    </form>
    <a class="home" href="index.html"><button>Back to Home</button></a>

    <footer>
        <div class="container">
            <div class="footer-logo">
                <div class="title">
                    <a href="./index.html">WeCode</a>
                </div>
                <div class="content">
                    <p>Sharing content, knowledge and information about coding community</p>
                </div>
            </div>
            <div class="footer-contact">
                <div class="title">
                    <h1>Contact</h1>
                </div>
                <div class="content">
                    <div class="contact-info">
                        <div class="icon">
                            <i class="fa-solid fa-phone-flip"></i>
                        </div>
                        <div class="info">
                            0977133586
                        </div>
                    </div>
                    <div class="contact-info">
                        <div class="icon">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="info">
                            admin@wecode.com
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-social-media">
                <div class="title">
                    <h1>Social media</h1>
                </div>
                <div class="content">
                    Follow our social medias to get the lastest news
                </div>
                <div class="content icon">
                    <a href="">
                        <i class="fab fa-facebook"></i>
                    </a>
                    <a href="">
                        <i class="fab fa-twitter"></i>
                    </a>
                    <a href="">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a href="">
                        <i class="fab fa-youtube"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="./assets/js/add.js"></script>
    <script type="module" src="./assets/js/logout.js"></script>

</body>

</html>
